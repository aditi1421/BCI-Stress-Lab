[project]
name = "bci-stress-lab"
version = "0.1.0"
description = "Offline, reproducible motor-imagery EEG stress experiments"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mne>=1.8,<2", "numpy>=1.26,<3", "scipy>=1.12,<2",
  "scikit-learn>=1.5,<2", "pydantic>=2.9,<3", "threadpoolctl>=3.5,<4",
  "matplotlib>=3.8,<4",
]

[project.scripts]
bci-stress = "bci_stress.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bci_stress"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: uses locally cached real EEG; never downloads"]

[tool.ruff]
line-length = 100
